name: Mobile background spacing

on:
  push:
    branches:
      - mobile-background-spacing

permissions:
  contents: write

jobs:
  patch-mobile-spacing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mobile-background-spacing

      - name: Add mobile top spacing and bump cache version
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('js/site-skin-manager.js')
          text = js.read_text(encoding='utf-8')
          text = text.replace('stable Adhit background manager v25', 'stable Adhit background manager v26')
          text = text.replace('padding-top: 10px !important;', 'padding-top: 70px !important;')
          text = text.replace('version: 25', 'version: 26')
          js.write_text(text, encoding='utf-8')

          for path in Path('.').glob('*.html'):
              html = path.read_text(encoding='utf-8')
              updated = html.replace('/js/site-skin-manager.js?v=25', '/js/site-skin-manager.js?v=26')
              updated = updated.replace('/js/site-skin-manager.js?v=24', '/js/site-skin-manager.js?v=26')
              if updated != html:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/mobile-background-spacing.yml

      - name: Commit changes
        run: |
          git config user.name "Betforecast automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- js/site-skin-manager.js '*.html' .github/workflows/mobile-background-spacing.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add mobile background top spacing"
          git push origin mobile-background-spacing