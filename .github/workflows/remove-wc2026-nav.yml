name: Remove WC2026 navigation

on:
  push:
    branches:
      - remove-wc2026-navigation

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: remove-wc2026-navigation

      - name: Replace WC2026 nav with Home
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          nav_re = re.compile(
              r'(<nav\b[^>]*(?:class="[^"]*(?:bf-nav|topbar-menu)[^"]*"|aria-label="Main navigation")[^>]*>)(.*?)(</nav>)',
              re.I | re.S,
          )
          wc_link_re = re.compile(
              r'\s*<a\b[^>]*href=["\']/?world-cup-2026\.html["\'][^>]*>.*?</a>\s*',
              re.I | re.S,
          )

          changed = []
          for path in sorted(Path('.').glob('*.html')):
              if path.name == 'world-cup-2026.html':
                  continue
              text = path.read_text(encoding='utf-8')

              def patch_nav(match):
                  opening, body, closing = match.groups()
                  if not wc_link_re.search(body):
                      return match.group(0)
                  home = '<a href="index.html">Home</a>'
                  if path.name == 'index.html':
                      home = '<a href="index.html" class="active">Home</a>'
                  body = wc_link_re.sub('\n        ' + home + '\n        ', body, count=1)
                  return opening + body + closing

              updated = nav_re.sub(patch_nav, text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.name)

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/remove-wc2026-nav.yml

      - name: Commit changes
        run: |
          git config user.name "Betforecast automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html' .github/workflows/remove-wc2026-nav.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Remove WC2026 from navigation and restore Home"
          git push origin remove-wc2026-navigation
